; PlatformIO Project Configuration for EchoNode Bedside Audio Player
; Target Hardware: Waveshare ESP32-S3 1.85-inch Round Display Board (360x360)

[env:waveshare_esp32s3_round]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Monitor Configuration
monitor_speed = 115200
upload_speed = 921600

; Flash and PSRAM settings matching MEMORY.md (16MB Flash, 8MB PSRAM OPI)
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv

build_src_filter = +<*.cpp> -<hardware_diagnostics.cpp>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl @ ^8.3.11
    https://github.com/schreibfaul1/ESP32-audioI2S.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    FS
    SD
    SPI
    Wire

; Dedicated Hardware Self-Test Environment for Phase 2 Verification
[env:diagnostics]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv

build_src_filter = +<hardware_diagnostics.cpp>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BUILD_DIAGNOSTICS
    -I include

lib_deps =
    FS
    SD
    SPI
    Wire
