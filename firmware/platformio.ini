; PlatformIO Project Configuration for EchoNode Bedside Audio Player
; Target Hardware: Original Waveshare ESP32-S3-Touch-LCD-1.85 (360x360 Round Display)
; Memory: ESP32-S3R8 (16MB Flash, 8MB PSRAM OPI)
; Audio: PCM5101 3-Wire I2S DAC (BCK=48, LRCK=38, DIN=47)
; Storage: TF MicroSD via TCA9554 EXIO3 CS (SCK=14, MISO=16, MOSI=17)

[env:waveshare_esp32s3_round]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Monitor Configuration
monitor_speed = 115200
upload_speed = 921600

; Flash and PSRAM settings matching MEMORY.md (16MB Flash, 8MB PSRAM OPI)
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv

build_src_filter = +<*.cpp> -<hardware_diagnostics.cpp>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl @ ^8.3.11
    https://github.com/schreibfaul1/ESP32-audioI2S.git
    FS
    SD
    SPI
    Wire

; Dedicated Hardware Self-Test Environment for Bench Diagnostics & Verification
[env:diagnostics]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv

build_src_filter = +<hardware_diagnostics.cpp> +<tca9554.cpp>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BUILD_DIAGNOSTICS
    -I include

lib_deps =
    FS
    SD
    SPI
    Wire
