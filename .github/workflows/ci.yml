name: EchoNode CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  architecture-and-backend-tests:
    name: Architecture Audits & Backend Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Authoritative Pinout & Dependency Audit
        run: |
          python tools/audit_pin_mappings.py

      - name: Partition Alignment & Boundary Check
        run: |
          python tools/check_partitions.py firmware/partitions_16MB.csv

      - name: Run Job Store Persistence & Lifecycle Tests
        run: |
          python backend/tests/test_job_store.py

      - name: Run Storage Adapter Tests
        run: |
          python backend/tests/test_storage.py

      - name: Run Backend Unit Tests
        run: |
          python backend/tests/test_backend.py

      - name: Run Audio-Only Video Rejection Tests
        run: |
          python backend/tests/test_audio_only.py

      - name: Run Phase 7 Pipeline Verification Tests
        run: |
          python backend/tests/test_phase7_verification.py

      - name: Run Audio Tone Generator
        run: |
          python tools/generate_test_tones.py

      - name: Test MicroSD Validator CLI
        run: |
          python tools/sd_card_verifier.py --help

  firmware-syntax-check:
    name: Firmware PlatformIO Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Verify Hardware Diagnostics Compilation
        working-directory: firmware
        run: |
          pio run -e diagnostics

      - name: Verify Production Round LCD Firmware Compilation
        working-directory: firmware
        run: |
          pio run -e waveshare_esp32s3_round
